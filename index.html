<body>
<p id="bootMsg" style="font-family:Cairo,Tahoma,sans-serif;text-align:center;padding:48px;color:#0d4a3e">جاري تحميل الموقع...</p>
<script>
(async function () {
  const BASE = "https://cdn.jsdelivr.net/gh/mazenasc3-cmd/rawdat-almuhibbin-@533db210b53ca0678b395bf000bdf484b022ddbe/index.html";
  const FALLBACK = "https://raw.githack.com/mazenasc3-cmd/rawdat-almuhibbin-/533db210b53ca0678b395bf000bdf484b022ddbe/index.html";
  async function load(url) {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "v=5");
    if (!r.ok) throw new Error("fetch");
    return r.text();
  }
  let html;
  try { html = await load(BASE); } catch (e) { html = await load(FALLBACK); }
  if (!html || html.indexOf("chatFab") < 0) throw new Error("bad html");

  const BOT = '<svg class="bot-av" viewBox="0 0 80 96" aria-hidden="true">'
    + '<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f5e6b8"/><stop offset="100%" stop-color="#d4b56a"/></linearGradient>'
    + '<linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a8a6a"/><stop offset="100%" stop-color="#0d4a3e"/></linearGradient>'
    + '<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f5f0"/><stop offset="100%" stop-color="#cfe8dc"/></linearGradient></defs>'
    + '<circle cx="40" cy="6" r="3.5" fill="#f0dca0"/><rect x="38.5" y="8" width="3" height="6" rx="1" fill="#b48a2c"/>'
    + '<ellipse cx="40" cy="22" rx="22" ry="12" fill="url(#tg)"/><ellipse cx="40" cy="17" rx="17" ry="9" fill="#fff8e7"/><circle cx="40" cy="11" r="6" fill="url(#tg)"/>'
    + '<rect x="22" y="24" width="36" height="32" rx="12" fill="url(#face)" stroke="#0d4a3e" stroke-width="1.5"/>'
    + '<rect x="28" y="34" width="10" height="8" rx="2" fill="#0d4a3e"/><rect x="42" y="34" width="10" height="8" rx="2" fill="#0d4a3e"/>'
    + '<rect x="30" y="36" width="4" height="3" rx="1" fill="#7dffb0"/><rect x="44" y="36" width="4" height="3" rx="1" fill="#7dffb0"/>'
    + '<path d="M32 48c3 4 13 4 16 0" fill="none" stroke="#0d4a3e" stroke-width="2" stroke-linecap="round"/>'
    + '<rect x="26" y="56" width="28" height="22" rx="6" fill="url(#tb)"/><rect x="34" y="62" width="12" height="8" rx="2" fill="#f0dca0" opacity=".85"/>'
    + '<rect x="52" y="58" width="8" height="16" rx="3" fill="url(#tb)"/>'
    + '<g fill="#d4b56a" stroke="#b48a2c" stroke-width="1"><circle cx="64" cy="70" r="2.4"/><circle cx="67" cy="75" r="2.2"/><circle cx="68" cy="81" r="2"/><circle cx="65" cy="86" r="1.8"/><circle cx="60" cy="89" r="1.6"/></g>'
    + '<path d="M56 72c4 2 8 6 10 12" fill="none" stroke="#b48a2c" stroke-width="1.5"/>'
    + '<rect x="28" y="78" width="10" height="8" rx="3" fill="#0d4a3e"/><rect x="42" y="78" width="10" height="8" rx="3" fill="#0d4a3e"/>'
    + '</svg>';

  html = html.replace(
    '<button class="chat-fab" id="chatFab" type="button" aria-label="المساعد التعليمي" aria-expanded="false">\n  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.9 3 3 6.3 3 10.3c0 2.2 1.2 4.2 3.2 5.5-.1 1-.6 2.2-1.4 3.1-.2.2 0 .6.3.6 1.8-.1 3.3-.9 4.2-1.6.9.2 1.8.3 2.7.3 5.1 0 9-3.3 9-7.6S17.1 3 12 3z"/></svg>\n  <span class="chat-fab__label">المساعد</span>\n</button>',
    '<button class="chat-fab" id="chatFab" type="button" aria-label="المساعد التعليمي" aria-expanded="false" title="مساعد الدار">\n  ' + BOT + '\n  <span class="chat-fab__label">المساعد</span>\n</button>'
  );
  html = html.replace(
    '<span class="chat-head__ic"><img src="assets/logo.jpg" alt=""></span>\n      <div class="chat-head__tx"><b>المساعد التعليمي</b><span>اسألني عن التجويد أو عن الدار</span></div>',
    '<span class="chat-head__ic">' + BOT + '</span>\n      <div class="chat-head__tx"><b>مساعد روضة المحبين</b><span>قرآن · تجويد · سنة · عن الدار</span></div>'
  );
  html = html.replace(
    "if(sub && Notification.permission==='granted'){\n      // جهاز مفعّل بالفعل: أخفِ الزر تمامًا.\n      fab.hidden=true;\n    }else{\n      fab.hidden=false;\n      paint();\n    }",
    "const enabled=!!(sub && Notification.permission==='granted');\n    if(enabled){\n      fab.hidden=true;\n      try{localStorage.setItem('rm_notif_on','1')}catch(e){}\n    }else{\n      fab.hidden=false;\n      paint();\n      let prompted=false;\n      try{prompted=localStorage.getItem('rm_notif_prompted')==='1'}catch(e){}\n      if(!prompted && Notification.permission!=='denied'){\n        setTimeout(function(){\n          if(sub && Notification.permission==='granted')return;\n          openModal();\n          try{localStorage.setItem('rm_notif_prompted','1')}catch(e){}\n        }, 2200);\n      }\n    }"
  );
  html = html.replace(
    "if(!r.ok)throw new Error('save');\n      paint();\n      // إشعار التفعيل يظهر لحظة ثم يُغلق تلقائيًا، والزر يختفي نهائيًا.\n      setTimeout(()=>close(),1600);",
    "if(!r.ok)throw new Error('save');\n      try{localStorage.setItem('rm_notif_on','1');localStorage.setItem('rm_notif_prompted','1')}catch(e){}\n      paint();\n      setTimeout(()=>close(),1600);"
  );

  const EXTRA = `\n<style id=\"rm-fix\">\n.chat-fab{\n  position:fixed !important; left:14px !important; right:auto !important;\n  bottom:calc(84px + env(safe-area-inset-bottom,0px)) !important;\n  width:72px !important; height:86px !important; padding:0 !important;\n  border:none !important; border-radius:16px !important;\n  background:transparent !important; box-shadow:none !important;\n  overflow:visible !important; z-index:48 !important;\n  transition:left .45s cubic-bezier(.19,1,.22,1), right .45s cubic-bezier(.19,1,.22,1) !important;\n  cursor:pointer !important; pointer-events:auto !important;\n}\n.chat-fab:after{display:none !important}\n.chat-fab .bot-av{width:72px !important;height:86px !important;display:block !important;filter:drop-shadow(0 6px 14px #0d4a3e55);pointer-events:none}\nbody.rm-soc-open .chat-fab{left:auto !important; right:14px !important}\n.chat-head__ic{width:48px !important;height:56px !important;border-radius:12px !important;overflow:visible !important;background:transparent !important;border:none !important;display:flex !important;align-items:center;justify-content:center}\n.chat-head__ic .bot-av{width:42px !important;height:50px !important}\n.chat-head__ic img{display:none !important}\n.soc{\n  position:fixed !important; left:14px !important; right:auto !important;\n  bottom:calc(18px + env(safe-area-inset-bottom,0px)) !important;\n  flex-direction:column-reverse !important; align-items:center !important;\n  gap:10px !important; z-index:47 !important; display:flex !important;\n}\n.soc .soc-toggle{\n  min-width:58px; height:50px !important; padding:0 14px !important;\n  border-radius:999px !important; border:2px solid #ffffff55 !important;\n  background:linear-gradient(145deg,#0d4a3e,#17705a) !important;\n  color:#fff !important; font:700 13px Cairo,sans-serif !important;\n  box-shadow:0 6px 18px #0005 !important; cursor:pointer !important;\n  display:inline-flex !important; align-items:center; justify-content:center; gap:6px;\n}\n.soc .soc-menu{\n  display:flex; flex-direction:column; gap:10px; align-items:center;\n  max-height:0; opacity:0; overflow:hidden; pointer-events:none;\n  transition:max-height .35s ease, opacity .25s ease, transform .25s ease;\n  transform:translateY(8px);\n}\n.soc.open .soc-menu{max-height:320px; opacity:1; pointer-events:auto; transform:none}\n.soc .soc-menu a{\n  width:50px; height:50px; border-radius:50%; display:grid; place-items:center;\n  color:#fff; box-shadow:0 4px 14px #0005; border:2px solid #ffffff33; text-decoration:none;\n}\n.soc .soc-menu a svg{width:22px; height:22px; fill:#fff}\n.soc .soc-toggle .chev{transition:transform .25s; font-size:12px}\n.soc.open .soc-toggle .chev{transform:rotate(180deg)}\n.loc-fab{display:none !important}\n.notif-fab{right:12px !important; left:auto !important; bottom:calc(20px + env(safe-area-inset-bottom,0px)) !important; z-index:46 !important}\n.hero{\n  background:\n    radial-gradient(ellipse 80% 60% at 50% -10%, #2a9b7a55 0%, transparent 55%),\n    linear-gradient(165deg, #062e27 0%, #0d4a3e 42%, #145c4c 78%, #0d4a3e 100%) !important;\n  padding: clamp(36px,7vw,56px) var(--pad) clamp(42px,8vw,60px) !important;\n  overflow:hidden;\n}\n.hero:before{\n  content:\"﴿\"; position:absolute; top:8%; right:6%;\n  font-family:Amiri,serif; font-size:clamp(80px,18vw,140px);\n  color:#ffffff0a; line-height:1; pointer-events:none;\n}\n.hero:after{\n  content:\"\"; position:absolute; inset:auto 0 0; height:4px;\n  background: linear-gradient(90deg, transparent, #f0dca0, #b48a2c, #f0dca0, transparent) !important;\n}\n.hero .lgw.big{box-shadow: 0 0 0 3px #f0dca066, 0 0 0 8px #ffffff12, 0 14px 36px #0005 !important}\n.ay{\n  display:inline-block !important; margin-top:16px !important; padding:10px 22px !important;\n  border-radius:999px !important; background:#00000028 !important; border:1px solid #f0dca055 !important;\n}\n.qk .card{border-radius:16px !important; position:relative; overflow:hidden}\n.qk .card:before{content:\"\"; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--gold),transparent)}\n.ab{border:1px solid var(--bd) !important; background:linear-gradient(135deg,#0d4a3e0a,#b48a2c0a) !important}\n.ab p{font-family:Amiri,serif !important; font-size:clamp(16px,3.8vw,19px) !important; line-height:1.9 !important}\n@media(max-width:640px){\n  .chat-fab{left:10px !important; bottom:calc(78px + env(safe-area-inset-bottom,0px)) !important; width:64px !important; height:78px !important}\n  .chat-fab .bot-av{width:64px !important; height:78px !important}\n  body.rm-soc-open .chat-fab{left:auto !important; right:10px !important}\n  .soc{left:10px !important}\n}\n</style>\n<script>\n(function(){\n  var busy = false;\n  var saved = [];\n  function setOpen(open){\n    document.body.classList.toggle('rm-soc-open', !!open);\n  }\n  function locLink(){\n    var box = document.getElementById('locFab');\n    if(!box) return null;\n    var a = box.querySelector('a');\n    if(!a || !a.getAttribute('href')) return null;\n    var c = a.cloneNode(true);\n    c.setAttribute('data-loc','1');\n    c.style.background = 'linear-gradient(145deg,#e53935,#c62828)';\n    return c;\n  }\n  function build(){\n    if(busy) return;\n    var soc = document.getElementById('soc');\n    if(!soc) return;\n    if(!soc.querySelector('.soc-toggle')){\n      var raw = Array.prototype.slice.call(soc.querySelectorAll('a'));\n      if(raw.length){ saved = raw.map(function(a){ return a.cloneNode(true); }); }\n    }\n    if(!saved.length) return;\n    busy = true;\n    var links = saved.map(function(a){ return a.cloneNode(true); });\n    var loc = locLink();\n    if(loc && !links.some(function(a){ return a.getAttribute('data-loc') === '1'; })) links.push(loc);\n    var open = soc.classList.contains('open');\n    soc.innerHTML = '';\n    var menu = document.createElement('div');\n    menu.className = 'soc-menu';\n    links.forEach(function(a){ menu.appendChild(a); });\n    var btn = document.createElement('button');\n    btn.type = 'button';\n    btn.className = 'soc-toggle';\n    btn.innerHTML = '<span>تواصل</span><span class=\"chev\">▲</span>';\n    btn.addEventListener('click', function(e){\n      e.preventDefault();\n      e.stopPropagation();\n      var on = soc.classList.toggle('open');\n      setOpen(on);\n    });\n    soc.appendChild(menu);\n    soc.appendChild(btn);\n    if(open){ soc.classList.add('open'); setOpen(true); }\n    soc.style.display = 'flex';\n    soc.hidden = false;\n    var lf = document.getElementById('locFab');\n    if(lf){ lf.hidden = true; lf.classList.remove('show'); }\n    busy = false;\n  }\n  document.addEventListener('click', function(e){\n    var soc = document.getElementById('soc');\n    if(!soc || !soc.classList.contains('open')) return;\n    if(!soc.contains(e.target)){\n      soc.classList.remove('open');\n      setOpen(false);\n    }\n  });\n  function bindChat(){\n    var fab = document.getElementById('chatFab');\n    if(!fab) return;\n    fab.style.pointerEvents = 'auto';\n    fab.addEventListener('click', function(e){\n      e.preventDefault();\n      e.stopPropagation();\n      if(typeof window.openChat === 'function') window.openChat();\n      else {\n        var w = document.getElementById('chatWrap');\n        if(w){ w.classList.add('open'); w.setAttribute('aria-hidden','false'); }\n        fab.classList.add('open');\n        fab.setAttribute('aria-expanded','true');\n      }\n    });\n  }\n  var n = 0;\n  var t = setInterval(function(){\n    n++;\n    build();\n    if(n === 2) bindChat();\n    if(n > 30) clearInterval(t);\n  }, 400);\n})();\n<\/script>`;

  html = html.replace('</body>', EXTRA + '\n</body>');
  document.open();
  document.write(html);
  document.close();
})().catch(function () {
  var el = document.getElementById("bootMsg");
  if (el) el.textContent = "تعذر تحميل الموقع. حدّث الصفحة.";
});
</script>
</body>
</html>
