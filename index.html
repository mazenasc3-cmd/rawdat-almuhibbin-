<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دار روضة المحبين لتحفيظ القرآن الكريم</title>
<link rel="icon" href="assets/logo.jpg">
</head>
<body>
<p id="bootMsg" style="font-family:Cairo,Tahoma,sans-serif;text-align:center;padding:48px;color:#0d4a3e">جاري تحميل الموقع...</p>
<script>
(async function () {
  const BASE = "https://cdn.jsdelivr.net/gh/mazenasc3-cmd/rawdat-almuhibbin-@533db210b53ca0678b395bf000bdf484b022ddbe/index.html";
  const FALLBACK = "https://raw.githack.com/mazenasc3-cmd/rawdat-almuhibbin-/533db210b53ca0678b395bf000bdf484b022ddbe/index.html";
  async function load(url) {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "v=2");
    if (!r.ok) throw new Error("fetch");
    return r.text();
  }
  let html;
  try { html = await load(BASE); } catch (e) { html = await load(FALLBACK); }
  if (!html || html.indexOf("chatFab") < 0) throw new Error("bad html");

  const BOT = '<svg class="bot-av" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f5e6b8"/><stop offset="100%" stop-color="#d4b56a"/></linearGradient><linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a8a6a"/><stop offset="100%" stop-color="#0d4a3e"/></linearGradient></defs><ellipse cx="32" cy="18" rx="18" ry="10" fill="url(#tg)"/><ellipse cx="32" cy="14" rx="14" ry="8" fill="#fff8e7"/><circle cx="32" cy="8" r="5" fill="url(#tg)"/><circle cx="32" cy="30" r="14" fill="#e8f5f0"/><circle cx="32" cy="30" r="14" fill="none" stroke="#0d4a3e" stroke-width="1.2"/><circle cx="27" cy="28" r="2.2" fill="#0d4a3e"/><circle cx="37" cy="28" r="2.2" fill="#0d4a3e"/><circle cx="27.6" cy="27.4" r=".7" fill="#fff"/><circle cx="37.6" cy="27.4" r=".7" fill="#fff"/><path d="M26 34c2.5 3 9.5 3 12 0" fill="none" stroke="#0d4a3e" stroke-width="1.6" stroke-linecap="round"/><path d="M18 52c2-8 10-12 14-12s12 4 14 12" fill="url(#tb)"/><g stroke="#b48a2c" stroke-width="1.4" fill="#d4b56a"><circle cx="48" cy="44" r="2.2"/><circle cx="51" cy="48" r="2"/><circle cx="52" cy="53" r="1.8"/><circle cx="50" cy="57" r="1.6"/><circle cx="46" cy="59" r="1.5"/><path d="M48 44c2 3 4 6 4 9" fill="none"/></g><path d="M44 12l1 2.5 2.5.4-1.8 1.8.5 2.5L44 18l-2.2 1.2.5-2.5-1.8-1.8 2.5-.4z" fill="#f0dca0"/></svg>';

  html = html.replace(
    ".chat-fab{position:fixed;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:46;display:flex;align-items:center;justify-content:center;width:54px;height:54px;padding:0;border:2px solid #ffffff4d;border-radius:50%;background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;font:700 14px Cairo,sans-serif;cursor:pointer;box-shadow:0 8px 24px #0006;transition:transform .3s cubic-bezier(.19,1,.22,1),box-shadow .3s ease,filter .3s ease}\n.chat-fab__label{display:none}\n.chat-fab svg{width:27px;height:27px;fill:currentColor}\n.chat-fab:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 14px 32px #0007;filter:brightness(1.08)}\n.chat-fab:active{transform:scale(.95)}\n.chat-fab:after{content:\"\";position:absolute;inset:-3px;border-radius:999px;border:2px solid var(--gold);opacity:.75;animation:fabPulse 2.6s ease-out infinite}\n@keyframes fabPulse{0%{transform:scale(1);opacity:.6}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}\n.chat-fab.open{filter:brightness(.9)}",
    ".chat-fab{position:fixed;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:46;display:flex;align-items:center;justify-content:center;width:64px;height:64px;padding:0;border:3px solid #f0dca0;border-radius:50%;background:linear-gradient(160deg,#0f5c4c 0%,#17705a 55%,#1a8a6a 100%);color:#fff;font:700 14px Cairo,sans-serif;cursor:pointer;box-shadow:0 8px 28px #0d4a3e66,0 0 0 4px #b48a2c33;transition:transform .3s cubic-bezier(.19,1,.22,1),box-shadow .3s ease,filter .3s ease;overflow:visible}\n.chat-fab__label{display:none}\n.chat-fab .bot-av{width:52px;height:52px;display:block;filter:drop-shadow(0 2px 4px #0004)}\n.chat-fab:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 14px 36px #0d4a3e88,0 0 0 5px #b48a2c55;filter:brightness(1.05)}\n.chat-fab:active{transform:scale(.95)}\n.chat-fab:after{content:\"\";position:absolute;inset:-5px;border-radius:999px;border:2px solid var(--gold);opacity:.7;animation:fabPulse 2.6s ease-out infinite;pointer-events:none}\n@keyframes fabPulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(1.2);opacity:0}100%{opacity:0}}\n.chat-fab.open{filter:brightness(.92)}\n.chat-head__ic{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0f5c4c,#1a8a6a)!important}\n.chat-head__ic .bot-av{width:34px;height:34px}\n.chat-head__ic img{display:none}"
  );

  html = html.replace(
    "  .chat-fab{right:10px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:48px;height:48px;padding:0}\n  .chat-fab svg{width:24px;height:24px}",
    "  .chat-fab{right:10px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;padding:0}\n  .chat-fab .bot-av{width:46px;height:46px}"
  );

  html = html.replace(
    '<button class="chat-fab" id="chatFab" type="button" aria-label="المساعد التعليمي" aria-expanded="false">\n  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.9 3 3 6.3 3 10.3c0 2.2 1.2 4.2 3.2 5.5-.1 1-.6 2.2-1.4 3.1-.2.2 0 .6.3.6 1.8-.1 3.3-.9 4.2-1.6.9.2 1.8.3 2.7.3 5.1 0 9-3.3 9-7.6S17.1 3 12 3z"/></svg>\n  <span class="chat-fab__label">المساعد</span>\n</button>',
    '<button class="chat-fab" id="chatFab" type="button" aria-label="المساعد التعليمي — اسأل عن القرآن والتجويد" aria-expanded="false" title="مساعد الدار">\n  ' + BOT + '\n  <span class="chat-fab__label">المساعد</span>\n</button>'
  );

  html = html.replace(
    '<span class="chat-head__ic"><img src="assets/logo.jpg" alt=""></span>\n      <div class="chat-head__tx"><b>المساعد التعليمي</b><span>اسألني عن التجويد أو عن الدار</span></div>',
    '<span class="chat-head__ic">' + BOT + '</span>\n      <div class="chat-head__tx"><b>مساعد روضة المحبين</b><span>قرآن · تجويد · سنة · عن الدار</span></div>'
  );

  html = html.replace(
    "if(sub && Notification.permission==='granted'){\n      // جهاز مفعّل بالفعل: أخفِ الزر تمامًا.\n      fab.hidden=true;\n    }else{\n      fab.hidden=false;\n      paint();\n    }",
    "const enabled=!!(sub && Notification.permission==='granted');\n    if(enabled){\n      fab.hidden=true;\n      try{localStorage.setItem('rm_notif_on','1')}catch(e){}\n    }else{\n      fab.hidden=false;\n      paint();\n      let prompted=false;\n      try{prompted=localStorage.getItem('rm_notif_prompted')==='1'}catch(e){}\n      if(!prompted && Notification.permission!=='denied'){\n        setTimeout(function(){\n          if(sub && Notification.permission==='granted')return;\n          openModal();\n          try{localStorage.setItem('rm_notif_prompted','1')}catch(e){}\n        }, 2200);\n      }\n    }"
  );

  html = html.replace(
    "if(!r.ok)throw new Error('save');\n      paint();\n      // إشعار التفعيل يظهر لحظة ثم يُغلق تلقائيًا، والزر يختفي نهائيًا.\n      setTimeout(()=>close(),1600);",
    "if(!r.ok)throw new Error('save');\n      try{localStorage.setItem('rm_notif_on','1');localStorage.setItem('rm_notif_prompted','1')}catch(e){}\n      paint();\n      setTimeout(()=>close(),1600);"
  );

  document.open();
  document.write(html);
  document.close();
})().catch(function () {
  var el = document.getElementById("bootMsg");
  if (el) el.textContent = "تعذر تحميل الموقع. حدّث الصفحة.";
});
</script>
</body>
</html>
