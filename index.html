<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دار روضة المحبين لتحفيظ القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0d4a3e;--g2:#17705a;--gold:#b48a2c;--bg:#fbf7ec;--card:#fff;--tx:#23322d;--mu:#6b7a74;--bd:#e6dfc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g:#46b596;--g2:#2f8f76;--gold:#d8b45e;--bg:#111c18;--card:#192924;--tx:#eaf1ee;--mu:#9bb0a8;--bd:#2a3f38}}
:root[data-theme=dark]{--g:#46b596;--g2:#2f8f76;--gold:#d8b45e;--bg:#111c18;--card:#192924;--tx:#eaf1ee;--mu:#9bb0a8;--bd:#2a3f38}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.8}
h1,h2,h3{font-family:Amiri,'Traditional Arabic',serif;margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--g);color:#fff;display:flex;gap:6px;align-items:center;padding:8px 14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:19}
nav b{font-family:Amiri,serif;font-size:20px;margin-inline-end:auto;color:#fff}
nav a{color:#fff;text-decoration:none;font-size:14px;padding:2px 8px;border-radius:12px}nav a:hover{background:#ffffff22}
.btn{background:var(--gold);color:#23322d;border:0;border-radius:10px;padding:7px 16px;font:600 14px Cairo,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.s{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.d{background:#b3402f;color:#fff}.btn.sm{padding:3px 10px;font-size:12px}
.hero{background:linear-gradient(160deg,var(--g),var(--g2));color:#fff;text-align:center;padding:60px 18px 70px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto 0 0;height:6px;background:var(--gold)}
.hero h1{font-size:clamp(32px,6vw,54px)}.hero p{max-width:640px;margin:10px auto;opacity:.95}
.ay{font-family:Amiri,serif;font-size:24px;color:#f0dca0;margin-top:14px}
section{max-width:1080px;margin:auto;padding:38px 16px}
section>h2{color:var(--g);font-size:32px;text-align:center;margin-bottom:6px}
section>h2:after{content:"";display:block;width:70px;height:3px;background:var(--gold);margin:6px auto 0;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 2px 8px #0000000d}
.card img.p{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--bd)}
.card h3{color:var(--g);font-size:22px;margin-top:8px}.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold))}
.empty{text-align:center;color:var(--mu);padding:30px;grid-column:1/-1}
.st{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px dashed var(--bd);font-size:14px}
details summary{cursor:pointer;color:var(--g);font-weight:600;margin:8px 0}
.post img,.post audio{width:100%;border-radius:12px;margin-top:8px}
.soc{position:fixed;left:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:30}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px #0004;transition:.2s}.soc a:hover{transform:scale(1.12)}
.soc svg{width:24px;height:24px;fill:#fff}
footer{background:var(--g);color:#fff;text-align:center;padding:22px 12px;font-size:14px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 30px}
.md{position:fixed;inset:0;background:#0007;z-index:60;display:grid;place-items:center;padding:14px}
.md>div{background:var(--card);border-radius:16px;padding:18px;width:min(480px,100%);max-height:90vh;overflow:auto}
label{display:block;font-size:13px;margin-top:10px;color:var(--mu)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs .btn{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.tabs .btn.on{background:var(--g);color:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:right}
.pg{display:none}.pg.on{display:block;animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
</style>
</head>
<body>
<nav>
  <b>دار روضة المحبين</b>
  <a href="#home">الرئيسية</a>
  <a href="#groups">المجموعات</a>
  <a href="#graduates">الخريجون</a>
  <a href="#posts">المنشورات</a>
  <a href="#admin" id="adminLink" style="display:none">لوحة الإشراف</a>
  <button class="btn sm" id="themeBtn" onclick="toggleTheme()">🌙</button>
  <button class="btn sm" id="loginBtn" onclick="toggleAuth()">دخول</button>
</nav>

<div class="hero" id="home">
  <img src="assets/logo.jpg" alt="شعار" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);margin-bottom:12px">
  <h1>دار روضة المحبين</h1>
  <p>لتحفيظ القرآن الكريم</p>
  <div class="ay">﴿ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا ﴾</div>
</div>

<section id="groups">
  <h2>المجموعات</h2>
  <div class="grid" id="groupsGrid"><div class="empty">جاري التحميل...</div></div>
</section>

<section id="graduates">
  <h2>الخريجون</h2>
  <div class="grid" id="graduatesGrid"><div class="empty">جاري التحميل...</div></div>
</section>

<section id="posts">
  <h2>المنشورات</h2>
  <div id="postsList"><div class="empty">جاري التحميل...</div></div>
</section>

<footer>
  دار روضة المحبين لتحفيظ القرآن الكريم &copy; <span id="year"></span>
</footer>

<div class="soc">
  <a href="#" style="background:#25d366" title="واتساب"><svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 012.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.188 8.188 0 01-1.26-4.38c.01-4.54 3.7-8.24 8.25-8.24zM8.68 7.35c-.16 0-.43.06-.66.31-.22.25-.87.86-.87 2.09 0 1.24.89 2.42 1.01 2.57.12.17 1.75 2.67 4.23 3.74 2.05.9 2.47.72 2.91.67.44-.05 1.42-.58 1.62-1.14.2-.56.2-1.05.14-1.14-.06-.1-.22-.16-.44-.28-.22-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.25-.64.78-.78.94-.14.17-.28.19-.5.07-.22-.12-.94-.35-1.8-1.1-.66-.59-1.11-1.32-1.24-1.54-.13-.22-.01-.34.1-.45.11-.11.25-.28.37-.42.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41-.14 0-.3-.01-.46-.01z"/></svg></a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("year").textContent = new Date().getFullYear();

function toggleTheme(){
  const root = document.documentElement;
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
}
(function(){
  const t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", t);
})();

let isAdmin = false;
onAuthStateChanged(auth, async u => {
  const btn = document.getElementById("loginBtn");
  const link = document.getElementById("adminLink");
  if (u) {
    btn.textContent = "خروج";
    const a = await getDoc(doc(db, "admins", u.uid));
    isAdmin = a.exists();
    link.style.display = isAdmin ? "" : "none";
  } else {
    btn.textContent = "دخول";
    link.style.display = "none";
    isAdmin = false;
  }
});

window.toggleAuth = () => auth.currentUser ? signOut(auth) : signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert("تعذر تسجيل الدخول: " + e.code));

// Groups
onSnapshot(collection(db, "groups"), snap => {
  const g = document.getElementById("groupsGrid");
  if (snap.empty) { g.innerHTML = "<div class=\"empty\">لا توجد مجموعات بعد</div>"; return; }
  g.innerHTML = "";
  snap.forEach(d => {
    const x = d.data();
    g.innerHTML += `<div class="card"><h3>${x.name||"مجموعة"}</h3><p class="mu">${x.teacher||""}</p><p>${x.desc||""}</p></div>`;
  });
});

// Graduates
onSnapshot(collection(db, "graduates"), snap => {
  const g = document.getElementById("graduatesGrid");
  if (snap.empty) { g.innerHTML = "<div class=\"empty\">لا يوجد خريجون بعد</div>"; return; }
  g.innerHTML = "";
  snap.forEach(d => {
    const x = d.data();
    g.innerHTML += `<div class="card"><h3>${x.name||""}</h3><p class="mu">${x.year||""}</p></div>`;
  });
});

// Posts
onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), snap => {
  const g = document.getElementById("postsList");
  if (snap.empty) { g.innerHTML = "<div class=\"empty\">لا توجد منشورات بعد</div>"; return; }
  g.innerHTML = "";
  snap.forEach(d => {
    const x = d.data();
    g.innerHTML += `<div class="card post" style="margin-bottom:14px"><h3>${x.title||""}</h3><p>${x.body||""}</p>${x.image?`<img src="${x.image}">`:""}</div>`;
  });
});
</script>
</body>
</html>
